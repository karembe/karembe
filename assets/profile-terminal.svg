      <animate attributeName="opacity" values="0;1" begin="2.15s" dur="0.3s" fill="freeze"/>
    </text>

    <rect x="47" y="67" width="8" height="20" fill="#d7dde6" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;1;0" keyTimes="0;0.56;0.63;0.72;0.81;1" dur="3.1s" fill="freeze"/>
    </rect>

    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.86;1" begin="0s" dur="3.35s" fill="freeze"/>
