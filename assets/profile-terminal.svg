      <tspan fill="#d7dde6"> Initializing karembe's profile...</tspan>
    </text>

    <rect x="48" y="145" width="1104" height="16" rx="3" fill="#171b22" stroke="#252b34" stroke-width="1"/>
    <rect x="48" y="145" width="0" height="16" rx="3" fill="url(#barFill)">
      <animate attributeName="width" values="0;1104" dur="2.8s" fill="freeze"/>
    </rect>

    <text x="48" y="197"
          font-family="'Liberation Mono', 'DejaVu Sans Mono', Consolas, Menlo, monospace"
          font-size="16" fill="#88919e" opacity="0">
      [OK] secure systems · cloud platforms · reliability
      <animate attributeName="opacity" values="0;1" begin="0.7s" dur="0.3s" fill="freeze"/>
    </text>

    <text x="48" y="226"
          font-family="'Liberation Mono', 'DejaVu Sans Mono', Consolas, Menlo, monospace"
          font-size="16" fill="#88919e" opacity="0">
