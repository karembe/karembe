      <animate attributeName="opacity" values="0;1" begin="1.45s" dur="0.3s" fill="freeze"/>
    </text>

    <text x="48" y="255"
          font-family="'Liberation Mono', 'DejaVu Sans Mono', Consolas, Menlo, monospace"
