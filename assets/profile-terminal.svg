  <g opacity="0">
    <text x="600" y="159" text-anchor="middle"
          font-family="'Liberation Mono', 'DejaVu Sans Mono', Consolas, Menlo, monospace"
          font-size="42" font-weight="700" fill="#d34a57" opacity="0.34">
      @karembe
      <animate attributeName="x" values="600;605;595;602;600" begin="3.35s" dur="0.42s" repeatCount="4"/>
    </text>
    <text x="600" y="159" text-anchor="middle"
          font-family="'Liberation Mono', 'DejaVu Sans Mono', Consolas, Menlo, monospace"
          font-size="42" font-weight="700" fill="#3aa8eb" opacity="0.34">
      @karembe
      <animate attributeName="x" values="600;594;606;598;600" begin="3.35s" dur="0.39s" repeatCount="4"/>
    </text>
    <text x="600" y="159" text-anchor="middle"
          font-family="'Liberation Mono', 'DejaVu Sans Mono', Consolas, Menlo, monospace"
          font-size="42" font-weight="700" fill="#e5e7eb">@karembe</text>
    <rect x="390" y="130" width="420" height="1.5" fill="#d34a57" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0;0.5;0" begin="3.55s" dur="0.8s"/>
      <animate attributeName="y" values="130;178;136;151;130" begin="3.55s" dur="0.8s"/>
    </rect>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.78;1" begin="3.30s" dur="2.05s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="600" y="123" text-anchor="middle"
          font-family="'Liberation Mono', 'DejaVu Sans Mono', Consolas, Menlo, monospace"
          font-size="39" font-weight="700" fill="#eceff4">
      Abdelkrim Bellagnech
      <animate attributeName="y" values="138;123" begin="5.25s" dur="0.9s" fill="freeze"/>
    </text>

    <rect x="389" y="145" width="0" height="2" rx="1" fill="#39e675" opacity="0.9">
      <animate attributeName="width" values="0;422" begin="5.45s" dur="0.9s" fill="freeze"/>
    </rect>

    <text x="600" y="187" text-anchor="middle"
          font-family="'Liberation Mono', 'DejaVu Sans Mono', Consolas, Menlo, monospace"
          font-size="19" font-weight="600" fill="#50c7f5">
      Software Engineering · DevSecOps · Cloud Engineering
      <animate attributeName="y" values="202;187" begin="5.62s" dur="0.9s" fill="freeze"/>
    </text>

    <text x="600" y="226" text-anchor="middle"
          font-family="'Liberation Mono', 'DejaVu Sans Mono', Consolas, Menlo, monospace"
          font-size="15" fill="#7f8998">secure systems · cloud platforms · reliability</text>

    <text x="600" y="254" text-anchor="middle"
          font-family="'Liberation Mono', 'DejaVu Sans Mono', Consolas, Menlo, monospace"
          font-size="13" fill="#515965">github.com/karembe</text>

    <animate attributeName="opacity" values="0;1" begin="5.1s" dur="0.8s" fill="freeze"/>
  </g>
</svg>