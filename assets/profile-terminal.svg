<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abdelkrim Bellagnech GitHub terminal banner">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#010101"/>
      <stop offset="55%" stop-color="#050607"/>
      <stop offset="100%" stop-color="#020304"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="0.04" cy="0.32" r="0.64">
      <stop offset="0%" stop-color="#7d1823" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#7d1823" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#7d1823" stop-opacity="0"/>
      <animate attributeName="cx" values="0.04;0.18;0.04" dur="16s" repeatCount="indefinite"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0.96" cy="0.74" r="0.60">
      <stop offset="0%" stop-color="#15549b" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#15549b" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#15549b" stop-opacity="0"/>
      <animate attributeName="cx" values="0.96;0.82;0.96" dur="18s" repeatCount="indefinite"/>
    </radialGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="65%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#pageBg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#redGlow)"/>
  <rect width="1200" height="300" rx="16" fill="url(#blueGlow)"/>

  <rect x="18" y="18" width="1164" height="264" rx="12" fill="#050607" stroke="#1f2937" stroke-opacity="0.78" stroke-width="1.5"/>
  <rect x="18" y="18" width="1164" height="30" rx="12" fill="#090b0e"/>
  <rect x="18" y="36" width="1164" height="12" fill="#090b0e"/>
  <circle cx="38" cy="33" r="4" fill="#4b5563"/>
  <circle cx="52" cy="33" r="4" fill="#374151"/>
  <circle cx="66" cy="33" r="4" fill="#374151"/>
  <text x="600" y="38" text-anchor="middle"
        font-family="'Liberation Mono', 'DejaVu Sans Mono', Consolas, Menlo, monospace"
        font-size="12" fill="#68707d">bash — karembe@github</text>

  <g id="terminal">
    <text x="48" y="83"
          font-family="'Liberation Mono', 'DejaVu Sans Mono', Consolas, Menlo, monospace"
          font-size="20" fill="#39e675">
      karembe@github:~$
      <tspan fill="#d7dde6"> load profile --user karembe</tspan>
    </text>

    <text x="48" y="124"
          font-family="'Liberation Mono', 'DejaVu Sans Mono', Consolas, Menlo, monospace"
